name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Static Export & Build Web App
        run: |
          if [ -f "next.config.ts" ]; then
            cat << 'EOF' > next.config.ts
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };
          export default nextConfig;
          EOF
          elif [ -f "next.config.mjs" ]; then
            cat << 'EOF' > next.config.mjs
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };
          export default nextConfig;
          EOF
          elif [ -f "next.config.js" ]; then
            cat << 'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };
          module.exports = nextConfig;
          EOF
          fi
          npm run build

      - name: Setup Capacitor Android & Microphone Permissions
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          WEB_DIR="out"
          if [ -d "dist" ]; then WEB_DIR="dist"; fi
          if [ -d "build" ]; then WEB_DIR="build"; fi
          mkdir -p "$WEB_DIR"
          cat << EOF > capacitor.config.json
          {
            "appId": "com.ucred.app",
            "appName": "Ucred",
            "webDir": "$WEB_DIR",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          npx cap add android

          # 1. AndroidManifest.xml mein Microphone & Audio permissions add karein
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n<\/manifest>/' "$MANIFEST"

          # 2. MainActivity mein WebView WebChromeClient ko Mic permission auto-grant karne ke liye configure karein
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" -o -name "MainActivity.kt" | head -n 1)
          if [[ "$MAIN_ACT" == *.java ]]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.ucred.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  WebView webView = getBridge().getWebView();
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }
          }
          EOF
          fi

          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
